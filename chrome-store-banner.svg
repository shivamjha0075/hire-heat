<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    
    <!-- Brand Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- Drop Shadow -->
    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="560" fill="url(#bgGradient)"/>
  
  <!-- Decorative Elements -->
  <circle cx="1200" cy="100" r="80" fill="#ef4444" opacity="0.1"/>
  <circle cx="1300" cy="200" r="60" fill="#f59e0b" opacity="0.15"/>
  <circle cx="200" cy="450" r="100" fill="#ef4444" opacity="0.08"/>
  
  <!-- Main Content Container -->
  <g transform="translate(80, 80)">
    
    <!-- Logo/Icon Section -->
    <g transform="translate(0, 50)">
      <!-- Fire Icon -->
      <g filter="url(#glow)">
        <path d="M60 120 C60 120, 40 100, 40 80 C40 60, 50 50, 60 40 C70 30, 80 35, 85 45 C90 35, 100 30, 110 40 C120 50, 125 65, 120 80 C115 95, 100 110, 85 120 C75 125, 65 125, 60 120 Z" fill="url(#brandGradient)" filter="url(#dropshadow)"/>
        <path d="M70 100 C70 100, 60 90, 60 80 C60 70, 65 65, 70 60 C75 55, 80 57, 82 62 C84 57, 88 55, 92 60 C96 65, 98 72, 96 80 C94 88, 88 95, 82 100 C78 102, 72 102, 70 100 Z" fill="#ffffff" opacity="0.9"/>
      </g>
      
      <!-- Brand Text -->
      <text x="140" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="700" fill="url(#brandGradient)" filter="url(#dropshadow)">HireHeat</text>
      <text x="140" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">LinkedIn Job Competition Tracker</text>
    </g>
    
    <!-- Feature Highlights -->
    <g transform="translate(0, 220)">
      <!-- Feature 1 -->
      <g>
        <circle cx="20" cy="20" r="8" fill="#ef4444"/>
        <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Real-Time Competition Tracking</text>
      </g>
      
      <!-- Feature 2 -->
      <g transform="translate(0, 40)">
        <circle cx="20" cy="20" r="8" fill="#f59e0b"/>
        <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Smart Job Analytics</text>
      </g>
      
      <!-- Feature 3 -->
      <g transform="translate(0, 80)">
        <circle cx="20" cy="20" r="8" fill="#ef4444"/>
        <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Low-Competition Discovery</text>
      </g>
    </g>
    
    <!-- Call to Action -->
    <g transform="translate(0, 350)">
      <rect x="0" y="0" width="280" height="50" rx="25" fill="url(#brandGradient)" filter="url(#dropshadow)"/>
      <text x="140" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Get Strategic Job Insights</text>
    </g>
  </g>
  
  <!-- Right Side Visual -->
  <g transform="translate(700, 80)">
    <!-- Mock LinkedIn Interface -->
    <rect x="0" y="0" width="600" height="400" rx="12" fill="#ffffff" filter="url(#dropshadow)"/>
    
    <!-- Header -->
    <rect x="20" y="20" width="560" height="60" rx="8" fill="#0a66c2"/>
    <text x="40" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff">LinkedIn Job Posting</text>
    
    <!-- Job Title -->
    <text x="40" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Senior Software Engineer</text>
    <text x="40" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#6b7280">Tech Company • San Francisco, CA</text>
    
    <!-- HireHeat Stats Overlay -->
    <rect x="40" y="170" width="520" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <g transform="translate(60, 190)">
      <circle cx="10" cy="10" r="6" fill="#ef4444"/>
      <text x="25" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1f2937">🔥 HireHeat Insights</text>
      
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#374151">📊 23 applicants • 🎯 Low competition • ⚡ Apply now!</text>
    </g>
    
    <!-- Job Description Preview -->
    <rect x="40" y="270" width="520" height="4" rx="2" fill="#e5e7eb"/>
    <rect x="40" y="285" width="400" height="4" rx="2" fill="#e5e7eb"/>
    <rect x="40" y="300" width="480" height="4" rx="2" fill="#e5e7eb"/>
    <rect x="40" y="315" width="350" height="4" rx="2" fill="#e5e7eb"/>
    
    <!-- Apply Button -->
    <rect x="40" y="350" width="120" height="35" rx="18" fill="#0a66c2"/>
    <text x="100" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Easy Apply</text>
  </g>
  
  <!-- Bottom Tagline -->
  <text x="700" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">Stop Applying Blind. Start Applying Smart.</text>
</svg>
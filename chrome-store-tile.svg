<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    
    <!-- Brand Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Radial Glow -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.3" />
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#transparent;stop-opacity:0" />
    </radialGradient>
    
    <!-- Drop Shadow -->
    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Glow Effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGradient)"/>
  
  <!-- Background Glow -->
  <circle cx="400" cy="400" r="300" fill="url(#glowGradient)"/>
  
  <!-- Decorative Elements -->
  <circle cx="150" cy="150" r="40" fill="#ef4444" opacity="0.15"/>
  <circle cx="650" cy="200" r="60" fill="#f59e0b" opacity="0.1"/>
  <circle cx="700" cy="600" r="80" fill="#ef4444" opacity="0.08"/>
  <circle cx="200" cy="650" r="50" fill="#f59e0b" opacity="0.12"/>
  
  <!-- Main Content -->
  <g transform="translate(400, 200)">
    
    <!-- Large Fire Icon -->
    <g transform="translate(-60, -40)" filter="url(#glow)">
      <path d="M60 120 C60 120, 30 90, 30 60 C30 30, 45 15, 60 0 C75 -15, 90 -10, 100 10 C110 -10, 130 -15, 150 0 C165 15, 175 35, 170 60 C165 85, 145 110, 120 120 C95 130, 85 130, 60 120 Z" fill="url(#brandGradient)" filter="url(#dropshadow)"/>
      <path d="M80 90 C80 90, 60 75, 60 60 C60 45, 70 35, 80 25 C90 15, 100 20, 105 30 C110 20, 120 15, 130 25 C140 35, 145 50, 140 60 C135 75, 125 85, 115 90 C105 95, 85 95, 80 90 Z" fill="#ffffff" opacity="0.9"/>
      <path d="M90 70 C90 70, 80 65, 80 60 C80 55, 83 52, 86 50 C89 48, 92 49, 94 52 C96 49, 99 48, 102 50 C105 52, 107 56, 106 60 C105 65, 102 68, 99 70 C96 71, 93 71, 90 70 Z" fill="#fbbf24" opacity="0.8"/>
    </g>
    
    <!-- Brand Text -->
    <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="url(#brandGradient)" text-anchor="middle" filter="url(#dropshadow)">HireHeat</text>
    
    <!-- Tagline -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1" text-anchor="middle">LinkedIn Job Competition Tracker</text>
  </g>
  
  <!-- Stats Section -->
  <g transform="translate(400, 450)">
    <!-- Stats Background -->
    <rect x="-180" y="-40" width="360" height="120" rx="20" fill="#1e293b" stroke="url(#brandGradient)" stroke-width="2" filter="url(#dropshadow)"/>
    
    <!-- Stats Content -->
    <g transform="translate(0, -10)">
      <!-- Stat 1 -->
      <g transform="translate(-120, 0)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#ef4444" text-anchor="middle">23</text>
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Applicants</text>
      </g>
      
      <!-- Stat 2 -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f59e0b" text-anchor="middle">LOW</text>
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Competition</text>
      </g>
      
      <!-- Stat 3 -->
      <g transform="translate(120, 0)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#10b981" text-anchor="middle">HIGH</text>
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Success Rate</text>
      </g>
    </g>
    
    <!-- Action Text -->
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">🎯 Perfect opportunity to apply!</text>
  </g>
  
  <!-- Bottom CTA -->
  <g transform="translate(400, 650)">
    <rect x="-150" y="-25" width="300" height="50" rx="25" fill="url(#brandGradient)" filter="url(#dropshadow)"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Apply Strategically</text>
  </g>
  
  <!-- Corner Branding -->
  <g transform="translate(50, 750)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">Chrome Extension</text>
  </g>
  
  <g transform="translate(750, 750)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="end">Free to Use</text>
  </g>
</svg>
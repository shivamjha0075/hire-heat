<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HireHeat Trends</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #f8fafc;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      border-radius: 12px;
      color: white;
    }
    
    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    
    .trends-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .trend-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    
    .trend-number {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .trend-label {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 4px;
    }
    
    .trend-change {
      font-size: 12px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 12px;
    }
    
    .trend-up {
      background: #fef2f2;
      color: #dc2626;
    }
    
    .trend-down {
      background: #f0fdf4;
      color: #16a34a;
    }
    
    .chart-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }
    
    .chart-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1f2937;
    }
    
    .job-trends-list {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    
    .job-trend-item {
      padding: 16px 20px;
      border-bottom: 1px solid #f3f4f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .job-trend-item:last-child {
      border-bottom: none;
    }
    
    .job-info {
      flex: 1;
    }
    
    .job-title {
      font-weight: 500;
      margin-bottom: 4px;
    }
    
    .job-stats {
      font-size: 12px;
      color: #6b7280;
    }
    
    .trend-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .heat-badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .heat-cold {
      background: #dcfce7;
      color: #166534;
    }
    
    .heat-warm {
      background: #fef3c7;
      color: #92400e;
    }
    
    .heat-hot {
      background: #fef2f2;
      color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📈 HireHeat Trends</h1>
    <p>Track job competition patterns over time</p>
  </div>
  
  <div class="trends-grid">
    <div class="trend-card">
      <div class="trend-number" id="totalJobs" style="color: #3b82f6;">0</div>
      <div class="trend-label">Total Jobs Tracked</div>
      <div class="trend-change" id="jobsChange">No change</div>
    </div>
    
    <div class="trend-card">
      <div class="trend-number" id="avgCompetition" style="color: #f59e0b;">0%</div>
      <div class="trend-label">Average Competition</div>
      <div class="trend-change" id="competitionChange">No change</div>
    </div>
    
    <div class="trend-card">
      <div class="trend-number" id="coldJobs" style="color: #22c55e;">0</div>
      <div class="trend-label">Cold Jobs Found</div>
      <div class="trend-change" id="coldJobsChange">No change</div>
    </div>
    
    <div class="trend-card">
      <div class="trend-number" id="hotJobs" style="color: #ef4444;">0</div>
      <div class="trend-label">Hot Jobs Found</div>
      <div class="trend-change" id="hotJobsChange">No change</div>
    </div>
  </div>
  
  <div class="chart-container">
    <div class="chart-title">📊 Competition Distribution</div>
    <canvas id="competitionChart" width="400" height="200"></canvas>
  </div>
  
  <div class="job-trends-list">
    <div style="padding: 16px 20px; background: #f9fafb; font-weight: 600; color: #374151;">
      Recent Job Tracking Activity
    </div>
    <div id="jobTrendsList"></div>
  </div>
  
  <script src="trends.js"></script>
</body>
</html>

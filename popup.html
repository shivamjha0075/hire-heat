<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 20px;
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }
    
    .tagline {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }
    
    .stats {
      background: linear-gradient(135deg, #f8fafc, #f1f5f9);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
    }
    
    .stat-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .stat-item:last-child {
      margin-bottom: 0;
    }
    
    .job-list {
      max-height: 200px;
      overflow-y: auto;
    }
    
    .job-item {
      padding: 8px;
      border-bottom: 1px solid #e0e0e0;
      font-size: 14px;
    }
    
    .job-title {
      font-weight: 500;
      margin-bottom: 4px;
    }
    
    .job-stats {
      color: #666;
      font-size: 12px;
      margin-bottom: 2px;
    }
    
    .job-date {
      color: #999;
      font-size: 11px;
    }
    
    .clear-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 12px;
      font-weight: 500;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    
    .clear-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔥 HireHeat</h1>
    <p class="tagline">Job Competition Tracker</p>
  </div>
  
  <div class="stats">
    <div class="stat-item">
      <span>Total Jobs Tracked:</span>
      <span id="totalJobs">0</span>
    </div>
    <div class="stat-item">
      <span>Total Applications:</span>
      <span id="totalClicks">0</span>
    </div>
  </div>
  
  <div id="jobList" class="job-list"></div>
  
  <button id="clearData" class="clear-btn">🗑️ Clear All Data</button>
  
  <script src="popup.js"></script>
</body>
</html>

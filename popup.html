<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 20px;
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }
    
    .tagline {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }
    
    .activate-section {
      text-align: center;
      padding: 20px 0;
    }
    
    .activate-section button {
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      color: white;
      margin-bottom: 12px;
    }
    
    .activate-btn {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
    }
    
    .activate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
    }
    
    .deactivate-btn {
      background: linear-gradient(135deg, #dc3545, #c82333);
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
    }
    
    .deactivate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 53, 69, 0.4);
    }
    
    .navigate-btn {
      background: linear-gradient(135deg, #007bff, #0056b3);
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
    }
    
    .navigate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
    }
    
    .activate-section button:active {
      transform: translateY(0);
    }
    
    .activate-btn:disabled {
      background: #22c55e;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }
    
    .status-text {
      font-size: 12px;
      color: #64748b;
      margin: 0;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔥 HireHeat</h1>
    <p class="tagline">Job Competition Tracker</p>
  </div>
  
  <div class="activate-section">
    <button id="activateBtn" class="activate-btn">🔥 Activate HireHeat</button>
    <p class="status-text" id="statusText">Click to start tracking job competition</p>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
